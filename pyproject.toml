[build-system]
requires = ["setuptools==80.10.2", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-mars"
version = "0.1.0rc6"
description = "MARS, the MCP Astronomy Research Suite: astronomy tools for LLM agents and Python, built on algorithms extracted from Skynet."
readme = "README.md"
requires-python = ">=3.12"
# Copyright the Skynet Robotic Telescope Network; the licence of the Skynet
# projects MARS grew from (README.md, License).
license = "GPL-3.0-only"
license-files = ["LICENSE"]
# As Skycat declares them: the author is the account that holds the PyPI and
# TestPyPI projects; the Skynet organisation maintains it. Copyright is the
# Skynet Robotic Telescope Network's (README.md, License).
authors = [{ name = "James Atkisson", email = "james@atkisson.net" }]
maintainers = [{ name = "SkynetRTN" }]
keywords = ["astronomy", "mcp", "llm", "agents", "photometry", "pulsar", "skynet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# What MARS imports, not what it happens to install: each is a direct
# dependency, bounded to the tested major (~=) so an install can share an
# environment. Exact versions live in uv.lock, which CI syncs with --locked.
dependencies = [
    "anthropic ~= 0.121",
    "anyio ~= 4.14",
    "astropy ~= 8.0",
    "astroquery ~= 0.4.11",
    "httpx ~= 0.28",
    "keyring ~= 25.7",
    "matplotlib ~= 3.11",
    "numba ~= 0.66",
    "numpy ~= 2.4",
    "pandas ~= 3.0",
    "photutils ~= 3.0",
    "pillow ~= 12.3",
    "psrqpy ~= 1.3",
    "pydantic ~= 2.13",
    "PyYAML ~= 6.0",
    "rich ~= 15.0",
    "scipy ~= 1.18",
    "sep ~= 1.4",
    "textual ~= 8.2",
    "textual-image ~= 0.13",
]

[project.urls]
Homepage = "https://github.com/SkynetRTN/MARS"
Repository = "https://github.com/SkynetRTN/MARS"
Issues = "https://github.com/SkynetRTN/MARS/issues"
Releases = "https://github.com/SkynetRTN/MARS/releases"
Documentation = "https://github.com/SkynetRTN/MARS/tree/dev/docs"

[project.scripts]
mars = "tools.tui:launch"
mars-bench = "tools.bench.cli:main"
mars-mcp = "tools.mcp.__main__:main"

[project.optional-dependencies]
mcp = [
    "jsonschema ~= 4.26",
    "mcp ~= 2.2",
]

# Development only (PEP 735): never in the wheel's metadata. `uv run` and
# `uv sync` install the dev group by default.
[dependency-groups]
dev = [
    # the release workflow classifies versions with it
    "packaging >= 24",
    "pytest ~= 9.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tools*", "algorithms*"]

[tool.setuptools.package-data]
"algorithms.skylib_lite.astrometry.anet" = ["ngc2000.dat"]
"tools.skill" = ["source/*.md", "source/references/*.md"]
"tools.mcp" = ["bundles.json", "icons/*.png"]
# The core data (docs/archive/mcp-tool-surface.md §3.5). tools/_data is a
# symlink to data/ in a checkout; these globs ship its core subtrees -- never
# data/optical/, which is the fetched optical bundle -- inside the wheel.
"tools" = [
    "_data/README.md",
    "_data/frame_provenance.json",
    "_data/pulsar/*",
    "_data/fieldcal/*.json",
    "_data/fieldcal/zp_solutions/*/*",
    "_data/afterglow/*",
    "_data/afterglow/*/*",
    "_data/variable_star/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `algorithms` and `tools` are imported as top-level packages, so the repo root
# must be on sys.path for the suite to run without installing the project.
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    # Reaches a remote astronomy service. Never runs by default -- see CLAUDE.md:
    # "Keep live remote astronomy service calls out of default checks." Requires
    # both `-m network` and MARS_TEST_NETWORK=1.
    "network: hits a live catalog service (opt-in, non-deterministic)",
    # Needs astrometry.net index files or a local UCAC4/UCAC5 catalog that are
    # not in this repo. Skips itself when the data is absent.
    "solver_data: needs astrometry index / ATLAS catalog data not in the repo",
    "slow: runs full source extraction + photometry over a real frame",
    # Reaches a live model-provider API. Never runs by default, mirroring
    # `network`: requires both `-m model_api` and MARS_TEST_MODEL_API=1.
    "model_api: hits a live model provider (opt-in, costs tokens/money)",
    # Needs a local Ollama daemon with the reference model pulled. Skips itself
    # when the daemon is unreachable.
    "ollama: needs a local Ollama daemon and a pulled model",
]
