# The Codex plugin's own environment. It is deliberately empty: src/server.py
# (a copy of the Claude Desktop extension's) runs the newest skynet-mars
# release from PyPI through `uv tool run`, so the plugin pins no MARS version
# and never needs a change to follow a release.
[project]
name = "mars-codex"
version = "1.0.0"
description = "Codex plugin that runs the newest skynet-mars MCP server"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false
