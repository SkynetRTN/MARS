# The Codex plugin's environment. Codex starts the server with
# `uv run --locked mars-mcp` in the installed plugin, which installs exactly
# what uv.lock beside this file pins. The skynet-mars pin names a published
# release, so it may trail the repository's version but never lead it, and
# uv.lock holds the root lock's versions (sync_lock.py; both checked by
# tests/test_codex_plugin.py).
[project]
name = "mars-codex"
version = "0.1.0rc5"
description = "Codex plugin that runs the skynet-mars MCP server"
requires-python = ">=3.13,<3.14"
dependencies = [
    "skynet-mars[mcp]==0.1.0rc5",
]

[tool.uv]
package = false
