# The Claude Desktop extension's environment. Claude Desktop runs
# `uv run --locked` in the unpacked extension, which installs exactly what
# uv.lock beside this file pins. The skynet-mars pin names a published
# release, so it may trail the repository's version but never lead it, and
# uv.lock holds the root lock's versions (sync_lock.py; both checked by
# tests/test_claude_desktop_extension.py).
[project]
name = "mars-claude-desktop"
version = "0.1.0rc4"
description = "Claude Desktop extension that runs the skynet-mars MCP server"
requires-python = ">=3.13,<3.14"
dependencies = [
    "skynet-mars[mcp]==0.1.0rc4",
]

[tool.uv]
package = false
