# Keeps what CI runs current. Each update is a pull request that CI tests on
# every supported Python (.github/workflows/ci.yml), so a release that breaks
# MARS is seen there before uv.lock moves to it.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    # A release must be a week old first: time for a broken or compromised
    # one to be caught upstream before it reaches uv.lock.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # One pull request for the routine minor and patch releases; a major
      # release, which pyproject.toml's ~= bounds must be widened to admit,
      # comes on its own.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
