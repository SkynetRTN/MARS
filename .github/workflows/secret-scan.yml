name: Secret scan

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the working tree
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1

      - name: Scan the commit history
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
