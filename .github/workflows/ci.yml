name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-syntax:
    name: python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile Python files
        run: python -m compileall -q tools algorithms tests

  python-tests:
    name: python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.13 is MARS's version: pyproject.toml's floor, the one
        # classifier PyPI shows, and the newest Python every dependency ships
        # wheels for (docs/installing.md). It is the only one tested.
        python: ["3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      # lfs: true only here. The three NGC 5286 B frames are Git LFS objects
      # and the field-calibration tests that drive them from pixels skip
      # themselves without the content -- which would let a regression pass CI
      # silently. The other two jobs read no pixels, so they keep the cheaper
      # pointer-only checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: python -m pip install uv

      # Without the optional [mcp] extra first: every test that drives the SDK
      # must skip itself cleanly when it is absent, as it is for a user who
      # never installs it. Only the MCP, skill and registry-coverage tests, so
      # this stays cheap.
      - name: Run the MCP tests without the [mcp] extra
        env:
          MPLBACKEND: Agg
        run: uv run --locked pytest tests/test_mcp_surface.py tests/test_mcp_bundles.py tests/test_skill_invariants.py tests/test_tool_registry_coverage.py

      # Then everything with it. Without the extra, every test of the server's
      # own validation -- the check that keeps undeclared arguments from a
      # tool -- skipped in CI and was never run by it.
      - name: Run pytest
        env:
          MPLBACKEND: Agg
        run: uv run --locked --extra mcp pytest

  # What the release workflow will build and upload, checked on every pull
  # request rather than first at a tag: an index accepts a broken wheel as
  # readily as a good one, and a PyPI version can never be re-uploaded.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      # No LFS: nothing the wheel ships is an LFS object (.gitattributes).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Build the wheel and the source distribution
        run: uv build --out-dir dist

      - name: Check the metadata renders as PyPI will show it
        run: uvx twine@6 check --strict dist/*

      - name: Check what the wheel carries
        run: python .github/scripts/check_dist.py dist/*.whl

      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/mars"
          wheel=$(ls dist/*.whl)
          "$RUNNER_TEMP/mars/bin/pip" install --quiet "${wheel}[mcp]"

      - name: Self-test through the protocol, outside the checkout
        env:
          MPLBACKEND: Agg
          MARS_HOME: ${{ runner.temp }}/mars-home
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/mars/bin/mars-mcp" self-test'

  repository-shape:
    name: repository shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required project files
        run: |
          test -f README.md
          test -f pyproject.toml
          test -f uv.lock
          test -f docs/tool-architecture.md
          test -f tools/registry.py
          test -f tools/agent/engine.py
          test -f tools/tui/app.py

  required:
    name: "required: ci"
    runs-on: ubuntu-latest
    if: always()
    needs: [python-syntax, python-tests, package, repository-shape]
    steps:
      - name: Fail unless every required CI job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::a required CI job failed, was cancelled, or was skipped"
            exit 1
          fi
          echo "all required CI jobs succeeded"
